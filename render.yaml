services:
  - type: web
    name: nexo-buscador
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 90 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: USD_A_PEN
        value: '3.7'
      - key: NEXO_MAX_DETALLES
        value: '12'
